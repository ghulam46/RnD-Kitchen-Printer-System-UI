<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbfafd" />
  <title>Kitchen Order Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Roboto', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              purple: '#9810fa',
              orange: '#ed8310',
              blue: '#2f73e8',
              green: '#20a568',
              ink: '#27233f',
              page: '#fbfafd'
            }
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    html { min-width: 320px; height: 100%; background: #fbfafd; }
    body { min-width: 320px; min-height: 100%; }
    @media (min-width: 768px) {
      html, body { height: 100%; overflow: hidden !important; }
    }
    @media (max-width: 767px) {
      html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
    }
    button:focus-visible { outline: 3px solid rgb(124 58 237 / 35%); outline-offset: 2px; }
    /* Animasi masuk hanya untuk card yang benar-benar baru (bukan saat re-render/filter) */
    .stage-card.card-enter { animation: card-in .28s ease both; }
    .stage-card.card-just-moved { animation: card-pop .34s cubic-bezier(.2,.8,.3,1.15); }
    @keyframes card-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes card-pop { from { opacity: .4; transform: scale(.985); } to { opacity: 1; transform: scale(1); } }
    .item-row.is-done .item-name, .item-row.is-done .item-note, .item-row.is-done .item-description,
    .item-row.is-moved .item-name, .item-row.is-moved .item-note, .item-row.is-moved .item-description { opacity: .5; text-decoration: line-through; }
    .item-row.is-moved { background: #faf9fc; }
    /* Card item bisa diklik untuk memilih → kursor + hover */
    .item-row[data-item-toggle] { cursor: pointer; }
    .item-row[data-item-toggle]:hover { border-color: #c4b5fd !important; box-shadow: 0 0 0 2px rgba(152,16,250,.12); }
    .item-row.is-moved .item-quantity { opacity: .4; }
    .item-move-button { color: #6b6580; border-color: #ded7ea; background: #fff; }
    .item-move-button:hover:not(:disabled) { color: #7c3aed; border-color: #c4b5fd; background: #f6f2ff; }
    .item-move-button:disabled { opacity: .38; cursor: not-allowed; }
    .item-move-button.is-on { color: #fff !important; border-color: transparent !important; }
    .item-move-button.is-on:hover:not(:disabled) { filter: brightness(1.08); }
    /* ── Card: catatan order, meta server/seat, tombol aksi ── */
    .order-note { font-style: italic; letter-spacing: .004em; }
    .item-meta-row { border-top: 1px dashed rgba(39, 35, 63, .12); }
    .item-meta { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; line-height: 1; }
    .item-chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 7px; padding: 4px 9px; font-size: 11.5px; font-weight: 700; line-height: 1; white-space: nowrap; }
    .item-chip svg { flex: none; }
    .item-quantity { letter-spacing: -.01em; }
    .band-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
    .moved-pill { box-shadow: 0 2px 6px rgba(39, 35, 63, .07); }
    .stage-choice:disabled { border-color: #e6e0ef !important; color: #b3adc2 !important; background: #f8f6fb !important; cursor: not-allowed; }
    .stage-choice:disabled:hover { transform: none !important; filter: none !important; }
    /* ── Dropdown tombol ••• : daftar teks polos, tanpa ikon ── */
    .more-menu { animation: menu-in .14s ease both; }
    .more-menu-item { display: block; width: 100%; border-radius: 10px; padding: 11px 12px; text-align: left; font-size: 15px; font-weight: 500; line-height: 1.5; color: #5d5872; transition: background .12s ease, color .12s ease; }
    .more-menu-item:hover, .more-menu-item:focus-visible { background: #f6f2ff; color: #7c3aed; outline: none; }
    /* Garis pembatas: full-width tepi-ke-tepi (margin negatif menetralkan p-2 container)
       + space 8px di atas & bawah */
    .more-menu-sep { height: 1px; margin: 8px -8px; background: #ece7f5; }
    /* ── Filter sales type: tombol pemicu (antar panel & tab New) + dropdown ── */
    /* Default: ikon abu (text-gray-500), sama seeding tombol refresh di baris ini. */
    .sales-toggle[aria-expanded="true"] { border-color: #9810fa; color: #9810fa; }
    /* Filter aktif: ring ungu + titik ungu di sudut kanan atas.
       Titik ini penanda satu-satunya, karena tombolnya tidak menampilkan teks. */
    .sales-toggle.is-filtering { border-color: #9810fa; color: #9810fa; }
    .sales-toggle::after { content: ''; position: absolute; top: -3px; right: -3px; width: 11px; height: 11px; border-radius: 999px; background: #9810fa; box-shadow: 0 0 0 2px #fff; opacity: 0; transform: scale(.5); transition: opacity .16s ease, transform .16s ease; pointer-events: none; }
    .sales-toggle.is-filtering::after { opacity: 1; transform: scale(1); }
    .sales-menu { animation: menu-in .14s ease both; }
    .sales-menu-item { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 14px; border-radius: 12px; padding: 12px 14px; text-align: left; font-size: 15px; font-weight: 700; line-height: 1.3; color: #2b2545; transition: background .12s ease, color .12s ease; }
    .sales-menu-item:hover, .sales-menu-item:focus-visible { background: #f6f2ff; color: #7c3aed; outline: none; }
    /* Opsi terpilih = pil peach dengan teks oranye (aksen brand) */
    .sales-menu-item[aria-checked="true"] { background: #fdefe0; color: #ed8310; }
    .sales-menu-item[aria-checked="true"]:hover, .sales-menu-item[aria-checked="true"]:focus-visible { background: #fbe3ca; color: #d96f08; }
    /* Lencana jumlah: lingkaran abu, lebar minimum sama agar angka sejajar */
    .sales-menu-count { flex: none; min-width: 26px; border-radius: 999px; background: #ecebf3; padding: 4px 9px; text-align: center; font-size: 13px; font-weight: 700; line-height: 1; color: #6b6580; }
    .sales-menu-item[aria-checked="true"] .sales-menu-count { background: #fff; color: #ed8310; }
    .timer.is-warning { border-color: #d93838 !important; color: #c62828 !important; }
    .timer.is-warning svg { color: #d93838 !important; }
    .order-list::-webkit-scrollbar { display: none; }
    .order-list { scrollbar-width: none; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    /* ── Panel menu: default TERBUKA, bisa diciutkan jadi rail huruf depan ── */
    #boardLayout { transition: grid-template-columns .24s cubic-bezier(.4,0,.2,1); }
    @media (min-width: 768px) {
      #boardLayout { grid-template-columns: 208px minmax(0,1fr); }
      #boardLayout.panel-collapsed { grid-template-columns: 64px minmax(0,1fr); }
    }
    /* ── Komponen tombol ikon panel ──
       Satu gaya untuk KEDUA tombol; keduanya hanya beda svg di dalam
       (varian chevron-kanan dan chevron-kiri). State: default + hover. */
    .icon-toggle { width: 35px; height: 35px; border-radius: 11px; border: 1px solid #e2c9f3; background: #f8f2ff; color: #9810fa; transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease; }
    .icon-toggle:hover { border-color: #9810fa; background: #f3e8ff; box-shadow: 0 4px 12px rgba(152,16,250,.16); }
    .panel-collapsed #menuPanel { padding: 10px 8px; height: auto; min-height: 0; }
    .panel-collapsed #menuPanelCollapse { display: none; }
    .panel-collapsed #menuPanelExpand { display: grid; }
    /* Rail sempit: konten tetap tampil, semua label dipotong dgn ellipsis */
    .panel-collapsed #menuPanelContent { display: block; overflow-x: hidden; }
    .panel-collapsed #menuPanelContent h2 { padding-right: 0; margin-left: 0; margin-right: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .panel-collapsed [data-menu-item] { padding-left: 0; padding-right: 0; min-width: 0; }
    .panel-collapsed [data-menu-item] > span:first-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .panel-collapsed [data-menu-item] > span:last-child { display: none; }
    /* ── Komponen tombol ikon oranye (menu tab) ──
       Struktur identik dengan .icon-toggle, hanya warna brand-nya oranye.
       Dua varian ikon: chevron-kanan (drawer tutup) dan chevron-kiri (drawer buka). */
    .icon-toggle--orange { width: 35px; height: 35px; border-radius: 12px; border: 1px solid #fbdcae; background: #fff8ef; color: #ed8310; transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease; }
    .icon-toggle--orange:hover { border-color: #ed8310; background: #ffeed6; box-shadow: 0 4px 12px rgba(237,131,16,.18); }
    /* Visibilitas ikon diatur oleh CSS komponen ini (bukan utilitas `hidden` Tailwind),
       supaya tidak bergantung urutan stylesheet.
       Ikon: MDI menu-close (≡>) saat drawer tertutup, MDI menu-open (≡<) saat terbuka. */
    .icon-toggle--orange [data-icon="menu-open"] { display: none; }
    /* State aktif: tombol ini memakai varian MDI menu-open (≡<) */
    .tabs-menu-toggle.is-open { border-color: #ed8310; }
    .tabs-menu-toggle.is-open [data-icon="menu-close"] { display: none; }
    .tabs-menu-toggle.is-open [data-icon="menu-open"] { display: block; }
    /* ── Drawer menu: panel slid dari kiri + overlay gelap ── */
    #menuDrawer.is-open #menuDrawerPanel { animation: drawer-in .26s cubic-bezier(.32,.72,0,1) both; }
    #menuDrawer.is-open #menuDrawerOverlay { animation: drawer-fade .26s ease both; }
    @keyframes drawer-in { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    @keyframes drawer-fade { from { opacity: 0; } to { opacity: 1; } }
    /* ── App shell: side navigation + top header ── */
    #appSidebar { width: 84px; transition: width .24s ease, opacity .18s ease; }
    .sidebar-collapsed #appSidebar { width: 0; min-width: 0; opacity: 0; overflow: hidden; border-right-width: 0; }
    /* ── Side navigation: ikon kiri + label, aksen aktif di tepi kanan ── */
    .nav-link { position: relative; display: flex; width: 100%; align-items: center; gap: 14px; border-radius: 14px; padding: 15px 18px; text-align: left; font-size: 15px; font-weight: 500; line-height: 1.2; color: #5d5872; transition: background .15s ease, color .15s ease; }
    .nav-link:hover { background: #f7f4fc; color: #7c3aed; }
    .nav-link svg { flex: none; width: 20px; height: 20px; }
    .nav-link.is-active, .nav-link.is-active:hover { background: #f3e8ff; color: #7c3aed; font-weight: 600; }
    /* Aksen aktif: batang ungu menempel tepi kanan baris */
    .nav-indicator { display: none; position: absolute; right: 0; top: 0; bottom: 0; width: 4px; border-radius: 999px; background: #7c3aed; }
    .nav-link.is-active .nav-indicator { display: block; }
    [data-menu-item] { height: 36px; min-height: 36px; border-radius: 999px; padding-left: 13px; padding-right: 13px; }
    [data-menu-item][aria-pressed="true"], [data-menu-item][aria-pressed="true"]:hover { background: #9810fa; color: #fff; font-weight: 700; }
    [data-menu-item][aria-pressed="true"] span:first-child { color: #fff; }
    [data-menu-item][aria-pressed="true"] span:last-child { background: #fff; color: #9810fa; }
    /* ── Side nav sub kategori: tinggi card 36px, tanpa gap antar item ── */
    .nav-subcat-list { display: block; margin: 0; padding: 0; list-style: none; }
    .nav-subcat-list > li { display: block; height: 36px; min-height: 36px; margin: 0; padding: 0; }
    .nav-subcat-list > li + li { margin-top: 0; padding-top: 0; }
    .workspace-option .ws-check { visibility: hidden; }
    .workspace-option.is-selected .ws-check { visibility: visible; }
    .app-menu { animation: menu-in .14s ease both; }
    .nav-scroll::-webkit-scrollbar, .app-menu::-webkit-scrollbar { display: none; }
    .nav-scroll, .app-menu { scrollbar-width: none; }
    /* ── Search: kotak, melebar saat diklik ── */
    #searchWrap { width: 35px; transition: width .3s cubic-bezier(.4,0,.2,1), border-color .2s ease, box-shadow .2s ease; }
    #searchWrap.is-open { width: min(270px, 60vw); border-color: #9810fa; box-shadow: 0 4px 14px rgba(39,35,63,.10); }
    #searchInput { opacity: 0; visibility: hidden; transition: opacity .18s ease .08s, visibility 0s linear .3s; }
    #searchWrap.is-open #searchInput { opacity: 1; visibility: visible; transition: opacity .18s ease .12s, visibility 0s linear 0s; }
    #searchClear { display: none; }
    #searchWrap.has-text #searchClear { display: grid; }
    /* ── Refresh: ikon berputar sekali saat diklik ── */
    #boardRefresh.is-spinning svg { animation: refresh-spin .55s cubic-bezier(.4,0,.2,1); }
    @keyframes menu-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes refresh-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    /* ── Print: hanya ticket order yang ikut cetak, seluruh UI disembunyikan ── */
    #printSheet { display: none; }
    @media print {
      body > *:not(#printSheet) { display: none !important; }
      #printSheet { display: block !important; }
      @page { margin: 12mm; }
    }
  </style>
</head>

    // ── Pita waktu (umur order): 0-1 mtr hijau · 1-2 mtr oranye · 2-3 mtr merah · >3 mtr merah tua ──

    const TIME_BANDS = [

    ];
    function timeBand(elapsedSeconds) {
      const value = Math.max(0, Number(elapsedSeconds) || 0);
      return TIME_BANDS.find(band => value < band.max) || TIME_BANDS[TIME_BANDS.length - 1];
    }
    function elapsedOf(order) {
      const value = Number(order.elapsed);
      if (Number.isFinite(value) && value >= 0) return value;
      return Math.max(0, (STAGES[order.stage] ? STAGES[order.stage].duration : 0) - (Number(order.remaining) || 0));
    }
    function bandOf(order) { return timeBand(elapsedOf(order)); }
    const STAGES = {
      new: { label: 'New', next: 'preparing', duration: 435, action: 'PREPARING', icon: 'play', soft: '#f4eeff', border: '#cda5f5', accent: '#9810fa', deep: '#4a1a86' },

      ready: { label: 'Ready', next: 'served', duration: 300, action: 'SERVED', icon: 'serve', soft: '#edf4ff', border: '#a9c8f8', accent: '#2667d7', deep: '#1a4a91' },
      // Served = stage akhir: tombol aksi berubah jadi REMAKE → kirim item balik ke Preparing (masak ulang)

    };

    // Order lama dari localStorage belum punya salesType → ditebak dari data order:
    // ada nomor meja =dine in,order tanpa meja (bawa pulang) = takeaway.
    function defaultSalesType(order) {
      const table = String(order.table || '').toLowerCase();
      if (table.includes('table')) return 'dinein';
      if (table.includes('go food') || table.includes('delivery')) return 'gofood';
      return 'takeaway';
    }
    const item = (qty, name, note = 'Crispy • More Sauce', description = '', server = '', seat = '') => ({ qty, name, note, description, server, seat });
    const makeOrder = (id, stage, customer, table, time, remaining, items, extra = {}) => ({ id, stage, customer, table, time, remaining, items, ...extra });
    // elapsed (detik) = umur order → menentukan pita warna: <60 hijau · <120 oranye · <180 merah · >180 merah tua
    const initialOrders = [
      makeOrder(1, 'new', 'RITA SUGIARTO', 'Table 06', '15:30', 435, [item(2, 'Ayam Goreng Spesial'), item(2, 'Ayam Goreng Spesial', 'Crispy • More Sauce', '', 'Sarah', 'Seat 05'), item(2, 'Ayam Goreng Spesial'), item(2, 'Ayam Goreng Spesial', 'Crispy • More Sauce', '', 'Sarah', 'Seat 05')], { elapsed: 25, pax: 4, salesType: 'dinein', description: 'Lorem ipsum sit amet dolor' }),
      makeOrder(2, 'new', 'ANDI PRATAMA', 'Table 04', '14:30', 388, [item(2, 'Nasi Goreng Spesial', 'Extra sambal', '', 'Dimas', 'Seat 02'), item(1, 'Iced Lemon Tea', 'Less ice')], { elapsed: 72, pax: 2, salesType: 'dinein', description: 'Extra sambal di meja, tolong cepat ya' }),

      makeOrder(4, 'new', 'RINA MELATI', 'Go Food #21', '15:28', 332, [item(1, 'Ayam Bakar Madu', 'Extra sauce'), item(2, 'Lychee Mojito', 'Less ice')], { elapsed: 210, pax: 3, salesType: 'gofood', description: 'Pelanggan sudah menunggu lama' }),
      makeOrder(5, 'new', 'AGUS WIJAYA', 'Takeaway #32', '15:29', 310, [item(2, 'Choco Lava Cake', 'Warm')], { elapsed: 40, pax: 2, salesType: 'takeaway', description: 'Order terlambat, segera antre' }),
      makeOrder(6, 'preparing', 'SITI RAHAYU', 'Table 02', '15:20', 420, [item(1, 'Ayam Bakar Madu', 'Extra sauce'), item(2, 'Lychee Mojito', 'Less ice', '', 'Bayu', 'Seat 01')], { elapsed: 95, pax: 2, salesType: 'dinein', description: 'Lorem ipsum sit amet dolor' }),
      makeOrder(7, 'preparing', 'BUDI SANTOSO', 'Table 03', '15:25', 510, [item(2, 'Nasi Goreng Spesial', 'Crispy'), item(1, 'Choco Lava Cake', 'Warm')], { elapsed: 165, pax: 3, salesType: 'dinein', description: 'Lorem ipsum sit amet dolor' }),
      makeOrder(8, 'preparing', 'DEWI ANGGRAENI', 'Go Food #18', '15:10', 366, [item(1, 'Beef Black Pepper', 'No onion'), item(2, 'Iced Lemon Tea', 'Less ice', '', 'Dimas', 'Seat 02')], { elapsed: 240, pax: 2, salesType: 'gofood', description: 'Lorem ipsum sit amet dolor' }),
      makeOrder(9, 'preparing', 'FAJAR NUGROHO', 'Takeaway #25', '15:15', 290, [item(1, 'Ayam Bakar Madu', 'Extra sauce'), item(1, 'Vanilla Gelato', 'Chocolate')], { elapsed: 30, pax: 4, salesType: 'takeaway', description: 'Lorem ipsum sit amet dolor' }),
      makeOrder(10, 'preparing', 'MAYA PUTRI', 'Table 08', '15:18', 244, [item(2, 'Nasi Goreng Spesial', 'Extra sambal', '', 'Sarah', 'Seat 05')], { elapsed: 110, pax: 2, salesType: 'dinein', description: 'Lorem ipsum sit amet dolor' }),
      makeOrder(11, 'ready', 'EKO WIJAYA', 'Table 12', '15:12', 180, [item(2, 'Iced Lemon Tea', 'Less ice'), item(1, 'Choco Lava Cake', 'Warm', '', 'Bayu', 'Seat 01')], { elapsed: 150, pax: 4, salesType: 'dinein', description: 'Lorem ipsum sit amet dolor' }),

      salesTypeToggle.title = `Filter sales type: ${label}`;
      salesTypeToggle.setAttribute('aria-label', `Filter sales type: ${label}`);
      // is-filtering → tombol menyala ungu saat ada filter aktif
      salesTypeToggle.classList.toggle('is-filtering', Boolean(activeSalesType));
    }
    // Ukur → tempatkan di bawah tombol, dijaga tetap di dalam viewport.
    function openSalesTypeMenu() {
      if (!salesTypeMenu || !salesTypeToggle || salesTypeOpen) return;
      renderSalesTypeMenu();
      salesTypeMenu.classList.remove('hidden');
      salesTypeToggle.setAttribute('aria-expanded', 'true');
      const rect = salesTypeToggle.getBoundingClientRect();
      const menuRect = salesTypeMenu.getBoundingClientRect();
      const gap = 6;
      const margin = 8;
      const top = Math.min(rect.bottom + gap, window.innerHeight - menuRect.height - margin);
      const left = Math.min(Math.max(rect.left, margin), Math.max(margin, window.innerWidth - menuRect.width - margin));
      salesTypeMenu.style.top = Math.max(margin, top) + 'px';
      salesTypeMenu.style.left = left + 'px';
      salesTypeOpen = true;
      const selected = salesTypeMenu.querySelector('.sales-menu-item[aria-checked="true"]') || salesTypeMenu.querySelector('.sales-menu-item');
      if (selected) selected.focus();
    }
    function closeSalesTypeMenu(refocus = false) {
      if (!salesTypeMenu || !salesTypeOpen) return;
      salesTypeMenu.classList.add('hidden');
      if (salesTypeToggle) salesTypeToggle.setAttribute('aria-expanded', 'false');
      salesTypeOpen = false;
      if (refocus && salesTypeToggle) salesTypeToggle.focus();
    }
    function setSalesType(value) {
      saveSalesType(value);
      closeSalesTypeMenu();
      render();
      showToast(`Filter sales type: ${salesLabel(activeSalesType)}`);
    }
    if (salesTypeToggle) {
      salesTypeToggle.addEventListener('click', event => {
        // stopPropagation: klik tombol tidak boleh ikut menutup menu yang baru dibuka
        event.stopPropagation();
        if (salesTypeOpen) closeSalesTypeMenu(true); else openSalesTypeMenu();
      });
    }
    if (salesTypeMenu) {
      salesTypeMenu.addEventListener('click', event => {
        event.stopPropagation();
        const option = event.target.closest('[data-sales-type]');
        if (!option) return;
        setSalesType(option.dataset.salesType);
        if (salesTypeToggle) salesTypeToggle.focus();
      });
      // Navigasi keyboard: ↑/↓ berpindah opsi, Escape menutup + kembali ke tombol
      salesTypeMenu.addEventListener('keydown', event => {
        const items = [...salesTypeMenu.querySelectorAll('.sales-menu-item')];
        if (!items.length) return;
        const index = items.indexOf(document.activeElement);
        if (event.key === 'ArrowDown') { event.preventDefault(); items[(index + 1) % items.length].focus(); }
        else if (event.key === 'ArrowUp') { event.preventDefault(); items[(index - 1 + items.length) % items.length].focus(); }
        else if (event.key === 'Home') { event.preventDefault(); items[0].focus(); }
        else if (event.key === 'End') { event.preventDefault(); items[items.length - 1].focus(); }
        else if (event.key === 'Escape') { event.preventDefault(); closeSalesTypeMenu(true); }
        else if (event.key === 'Tab') { closeSalesTypeMenu(); }
      });
    }
    document.addEventListener('click', () => closeSalesTypeMenu());
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && salesTypeOpen) closeSalesTypeMenu(true);
    });
    window.addEventListener('resize', () => closeSalesTypeMenu());
    window.addEventListener('scroll', () => closeSalesTypeMenu(), true);
    // animateNew = true hanya saat memang ada order/card baru yang masuk board
    // closeMoreMenu(): card di-re-render → tombol ••• lama hilang, menu harus ikut tutup
    // renderSalesTypeToggle(): label + tombol selalu sinkron dengan filter aktif
    function render(animateNew = false) { closeMoreMenu(); renderTabs(); renderMenuCounts(); renderSalesTypeToggle(); renderBoard(animateNew); }
    function moveItemsToStage(order, entries, fromStage, nextStage) {
      if (!order || !STAGES[nextStage] || fromStage === nextStage) return;
      const movable = entries.filter(entry => entry.stage === fromStage);
      if (!movable.length) return;
      movable.forEach(entry => {
        entry.movedFrom = fromStage;
        entry.stage = nextStage;
        entry.done = false;
        selectedItemIds.delete(entry.id);
      });
      // Pindah stage = stage baru → umur order di-reset → kartu kembali hijau
      order.elapsed = 0;
      lastMovedId = order.id;
      saveOrders();
      // Card ini benar-benar masuk board stage tujuan → boleh animasi (card-just-moved)
      render(true);
      showToast(`${movable.length} item · ${STAGES[fromStage].label} → ${STAGES[nextStage].label} · ${order.customer}`);
    }
    function moveSelectedToStage(order, boardStage, nextStage) {
      if (!order) return;
      // Hanya item terpilih yang TERLIHAT (lolos filter menu) yang dipindahkan
      const selected = filteredItems(order, boardStage).filter(entry => selectedItemIds.has(entry.id));
      if (!selected.length) { showToast('Pilih menu dulu lewat tombol panah'); return; }
      moveItemsToStage(order, selected, boardStage, nextStage);
    }
    function moveColumnToStage(order, fromStage, nextStage) {
      if (!order || !STAGES[fromStage] || !STAGES[nextStage] || fromStage === nextStage) return;
      // Tombol aksi kolom: hormati filter menu → hanya item terpilih kategori itu
      const inStage = order.items.filter(entry => entry.stage === fromStage);
      const items = selectedMenu ? inStage.filter(entry => entry.name === selectedMenu) : inStage;
      if (!items.length) { showToast(`Tidak ada item di stage ${STAGES[fromStage].label}`); return; }
      moveItemsToStage(order, items, fromStage, nextStage);
    }
    function advance(order, boardStage) {
      if (!order) return;
      // Tab Served: aksi tombol = remake → kirim item balik ke Preparing
      const next = STAGES[boardStage].next || STAGES[boardStage].remake || null;
      if (!next) { showToast(`Item di ${order.customer} sudah tersaji`); return; }
      moveColumnToStage(order, boardStage, next);
    }
    // ══════════ DROPDOWN TOMBOL ••• ══════════
    // Isi menu: New · Preparing · Ready · Served (pindah stage) + Print (cetak ticket).
    // Satu elemen menu global (position: fixed) karena card memakai overflow-hidden,
    // jadi menu di dalam card akan ikut terpotong.
    const moreMenu = document.getElementById('moreMenu');
    const printSheet = document.getElementById('printSheet');
    let moreMenuOrderId = null;
    let moreMenuButton = null;
    // Menu menyesuaikan stage card: stage yang SEDANG DIBUKA tidak dicantumkan,
// jadi saat di New → Preparing · Ready · Served · Print (dan seterusnya).
    function renderMoreMenu(order, boardStage) {
      const stageItems = Object.entries(STAGES)
        .filter(([key]) => key !== boardStage)
        .map(([key, config]) => `<button type="button" role="menuitem" class="more-menu-item" data-more-stage="${key}" aria-label="Pindahkan order ${escapeHtml(order.customer)} dari ${escapeHtml(STAGES[boardStage].label)} ke ${escapeHtml(config.label)}">${escapeHtml(config.label)}</button>`)
        .join('');
      const printItem = `<button type="button" role="menuitem" class="more-menu-item" data-more-print="1" aria-label="Cetak ticket order ${escapeHtml(order.customer)}">Print</button>`;
      // Pemisah supaya Print terasa sebagai aksi terpisah dari daftar stage
      moreMenu.innerHTML = `${stageItems}<span class="more-menu-sep"></span>${printItem}`;
    }
    function closeMoreMenu(refocus = false) {
      if (!moreMenu) return;
      const button = moreMenuButton;
      moreMenu.classList.add('hidden');
      moreMenuButton = null;
      moreMenuOrderId = null;
      // Tombol bisa sudah hilang karena render() → jangan restore fokus ke elemen mati
      if (button && document.contains(button)) {
        button.setAttribute('aria-expanded', 'false');
        if (refocus) button.focus();
      }
    }
    function openMoreMenu(button) {
      const card = button.closest('[data-order-id]');
      if (!card || !moreMenu) return;
      const order = getOrder(card.dataset.orderId);
      if (!order) return;
      const boardStage = card.dataset.boardStage;
      moreMenuOrderId = order.id;
      moreMenuButton = button;
      renderMoreMenu(order, boardStage);
      moreMenu.classList.remove('hidden');
      button.setAttribute('aria-expanded', 'true');
      // Ukur lalu tempatkan: default di ATAS tombol (footer ada di bawah card),
      // membalik ke bawah bila tidak cukup ruang, selalu di dalam viewport.
      const rect = button.getBoundingClientRect();
      const menuRect = moreMenu.getBoundingClientRect();
      const gap = 8;
      const margin = 8;
      let top = rect.top - menuRect.height - gap;
      if (top < margin) top = Math.min(rect.bottom + gap, window.innerHeight - menuRect.height - margin);
      let left = rect.right - menuRect.width;
      left = Math.min(Math.max(left, margin), Math.max(margin, window.innerWidth - menuRect.width - margin));
      moreMenu.style.top = Math.max(margin, top) + 'px';
      moreMenu.style.left = left + 'px';
      const focusable = moreMenu.querySelector('.more-menu-item:not([disabled])') || moreMenu.querySelector('.more-menu-item');
      if (focusable) focusable.focus();
    }
    function toggleMoreMenu(button) {
      const card = button.closest('[data-order-id]');
      const order = card ? getOrder(card.dataset.orderId) : null;
      if (order && moreMenuOrderId === order.id && moreMenu && !moreMenu.classList.contains('hidden')) closeMoreMenu(true);
      else openMoreMenu(button);
    }
    // ── Ticket cetak (isi #printSheet, lalu dialog print browser) ──
    function buildPrintTicket(order) {
      const sales = SALES_TYPES[order.salesType] || SALES_TYPES.dinein;
      const rows = order.items.map(entry => `<tr><td style="width:36px;font-weight:800;vertical-align:top">${escapeHtml(entry.qty)}x</td><td style="vertical-align:top"><strong>${escapeHtml(entry.name)}</strong>${entry.note ? `<div style="font-size:11px;font-style:italic">${escapeHtml(entry.note)}</div>` : ''}</td><td style="width:132px;font-size:11px;vertical-align:top">${escapeHtml([entry.server, entry.seat].filter(Boolean).join(' · '))}</td></tr>`).join('');
      return `<div style="font-family:Roboto,Arial,sans-serif;color:#111;font-size:12px"><div style="display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:10px"><div><div style="font-size:17px;font-weight:800">BigDeals · Kitchen</div><div style="font-size:11px">Ticket order #${escapeHtml(order.id)}</div></div><div style="font-size:11px;text-align:right">${escapeHtml(order.time)}<br />${escapeHtml(sales.label)}</div></div><div style="margin-bottom:6px"><strong>${escapeHtml(order.customer)}</strong> · ${escapeHtml(order.table)} · ${escapeHtml(order.pax)} pax</div>${order.description ? `<div style="margin-bottom:8px;font-size:11px;font-style:italic">&quot;${escapeHtml(order.description)}&quot;</div>` : ''}<table style="width:100%;border-collapse:collapse"><thead><tr style="border-bottom:1px solid #111;text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase"><th style="padding:4px 0">Qty</th><th style="padding:4px 0">Item</th><th style="padding:4px 0">Server / Seat</th></tr></thead><tbody>${rows}</tbody></table><div style="margin-top:12px;border-top:1px dashed #999;padding-top:6px;font-size:10px">Stage ${escapeHtml(STAGES[order.stage].label)} · sisa waktu ${escapeHtml(formatTime(order.remaining))}</div></div>`;
    }
    function printOrder(order) {
      if (!order || !printSheet) return;
      printSheet.innerHTML = buildPrintTicket(order);
      showToast(`Cetak ticket ${order.customer} · ${order.table}`);
      setTimeout(() => window.print(), 80);
    }
    if (moreMenu) {
      moreMenu.addEventListener('click', event => {
        event.stopPropagation();
        const card = moreMenuButton ? moreMenuButton.closest('[data-order-id]') : null;
        const order = getOrder(moreMenuOrderId);
        const boardStage = card ? card.dataset.boardStage : null;
        const stageButton = event.target.closest('[data-more-stage]');
        if (stageButton) {
          const target = stageButton.dataset.moreStage;
          closeMoreMenu();
          if (!order || !boardStage || target === boardStage) return;
          moveColumnToStage(order, boardStage, target);
          return;
        }
        if (event.target.closest('[data-more-print]')) { closeMoreMenu(); printOrder(order); }
      });
      // Navigasi keyboard: ↑/↓ berpindah item, Escape menutup + kembali ke tombol •••
      moreMenu.addEventListener('keydown', event => {
        const items = [...moreMenu.querySelectorAll('.more-menu-item:not([disabled])')];
        if (!items.length) return;
        const index = items.indexOf(document.activeElement);
        if (event.key === 'ArrowDown') { event.preventDefault(); items[(index + 1) % items.length].focus(); }
        else if (event.key === 'ArrowUp') { event.preventDefault(); items[(index - 1 + items.length) % items.length].focus(); }
        else if (event.key === 'Home') { event.preventDefault(); items[0].focus(); }
        else if (event.key === 'End') { event.preventDefault(); items[items.length - 1].focus(); }
        else if (event.key === 'Escape') { event.preventDefault(); closeMoreMenu(true); }
      });
    }
    document.addEventListener('click', () => closeMoreMenu());
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && moreMenuOrderId !== null) closeMoreMenu(true); });
    window.addEventListener('resize', () => closeMoreMenu());
    window.addEventListener('scroll', () => closeMoreMenu(), true);
    orderList.addEventListener('click', event => {
      const selectButton = event.target.closest('[data-item-select]');
      if (selectButton) {
        if (selectButton.disabled) return;
        const id = selectButton.dataset.itemSelect;
        toggleItemSelection(id);
        const restored = orderList.querySelector(`[data-item-select="${id.replace(/"/g, '\\"')}"]`);
        if (restored) restored.focus();
        return;
      }
      // Klik langsung pada card item (per menu) → pilih / batal pilih
      const itemRow = event.target.closest('[data-item-toggle]');
      if (itemRow) {
        const id = itemRow.dataset.itemToggle;
        toggleItemSelection(id);
        const restored = orderList.querySelector(`[data-item-select="${id.replace(/"/g, '\\"')}"]`);
        if (restored) restored.focus();
        return;
      }
      const check = event.target.closest('[data-check]');
      if (check) return;
      const stageButton = event.target.closest('[data-selected-stage]');
      if (stageButton) {
        if (stageButton.disabled) return;
        const card = stageButton.closest('[data-order-id]');
        moveSelectedToStage(getOrder(card.dataset.orderId), card.dataset.boardStage, stageButton.dataset.selectedStage);
        return;
      }
      // Tab Served: tombol REMAKE hanya mengirim ITEM YANG DIPILIH balik ke Preparing
      const remakeButton = event.target.closest('[data-remake]');
      if (remakeButton) {
        if (remakeButton.disabled) return;
        const card = remakeButton.closest('[data-order-id]');
        moveSelectedToStage(getOrder(card.dataset.orderId), card.dataset.boardStage, remakeButton.dataset.remakeTo);
        return;
      }
      const advanceButton = event.target.closest('[data-advance]');
      if (advanceButton && !advanceButton.disabled) advance(getOrder(advanceButton.dataset.advance), advanceButton.closest('[data-order-id]').dataset.boardStage);
      const moreButton = event.target.closest('[data-more]');
      if (moreButton) {
        // stopPropagation: klik ••• tidak boleh ikut menutup menu yang baru dibuka
        event.stopPropagation();
        toggleMoreMenu(moreButton);
      }
    });
    orderList.addEventListener('keydown', event => {
      if (event.key === 'Escape' && selectedItemIds.size) {
        selectedItemIds.clear();
        render();
      }
    });
    tabs.addEventListener('click', event => {
      const button = event.target.closest('[data-stage]');
      if (!button) return;
      activeStage = button.dataset.stage;
      render();
    });
    // ── Modal menu (drawer): tombol tab bar membuka, overlay/Escape menutup ──
    const tabsMenuToggle = document.getElementById('tabsMenuToggle');
    const menuDrawer = document.getElementById('menuDrawer');
    const menuDrawerClose = document.getElementById('menuDrawerClose');
    const menuDrawerOverlay = document.getElementById('menuDrawerOverlay');
    const setMenuDrawer = open => {
      if (!menuDrawer || !tabsMenuToggle) return;
      menuDrawer.classList.toggle('hidden', !open);
      menuDrawer.classList.toggle('is-open', open);
      menuDrawer.setAttribute('aria-hidden', String(!open));
      // Tombol tab bar ikut berganti ikon menu-close ⇄ menu-open
      tabsMenuToggle.classList.toggle('is-open', open);
      tabsMenuToggle.setAttribute('aria-pressed', String(open));
      tabsMenuToggle.setAttribute('aria-label', open ? 'Tutup menu' : 'Buka menu tab');
      if (open) { if (menuDrawerClose) menuDrawerClose.focus(); }
      else tabsMenuToggle.focus();
    };
    if (tabsMenuToggle) tabsMenuToggle.addEventListener('click', () => setMenuDrawer(true));
    if (menuDrawerClose) menuDrawerClose.addEventListener('click', () => setMenuDrawer(false));
    if (menuDrawerOverlay) menuDrawerOverlay.addEventListener('click', () => setMenuDrawer(false));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && menuDrawer && menuDrawer.classList.contains('is-open')) setMenuDrawer(false);
    });
    document.querySelectorAll('[data-menu-item]').forEach(button => {
      button.addEventListener('click', () => {
        const name = button.dataset.menuItem;
        selectedMenu = selectedMenu === name ? '' : name;
        document.querySelectorAll('[data-menu-item]').forEach(item => item.setAttribute('aria-pressed', String(item.dataset.menuItem === selectedMenu)));
        render();
        if (selectedMenu) showToast(`Filter aktif: ${selectedMenu}`);
      });
    });
    // ── Search: kotak → melebar saat diklik ──
    const searchWrap = document.getElementById('searchWrap');
    const searchToggle = document.getElementById('searchToggle');
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');
    const boardRefresh = document.getElementById('boardRefresh');
    function setSearchOpen(open) {
      searchWrap.classList.toggle('is-open', open);
      searchToggle.setAttribute('aria-expanded', String(open));
      if (open) searchInput.focus();
      else { searchInput.blur(); searchInput.value = ''; applySearch(''); }
    }
    function applySearch(value) {
      searchQuery = value.trim();
      searchWrap.classList.toggle('has-text', Boolean(searchQuery));
      render();
    }
    searchToggle.addEventListener('click', () => setSearchOpen(!searchWrap.classList.contains('is-open')));
    searchInput.addEventListener('input', () => applySearch(searchInput.value));
    searchInput.addEventListener('keydown', event => {
      if (event.key === 'Escape') { event.stopPropagation(); setSearchOpen(false); }
    });
    searchClear.addEventListener('click', () => { searchInput.value = ''; applySearch(''); searchInput.focus(); });
    let lastTickAt = Date.now();
    setInterval(() => {
      const now = Date.now();
      const elapsed = Math.max(1, Math.round((now - lastTickAt) / 1000));
      lastTickAt = now;
      let changed = false;
      let bandChanged = false;
      orders.forEach(order => {
        if (order.remaining > 0) { order.remaining = Math.max(0, order.remaining - elapsed); changed = true; }
        const bandBefore = bandOf(order).key;
        order.elapsed = elapsedOf(order) + elapsed;
        if (bandOf(order).key !== bandBefore) bandChanged = true;
        document.querySelectorAll(`[data-timer="${order.id}"]`).forEach(timer => {
          timer.querySelector('span').textContent = formatTime(order.remaining);
          timer.setAttribute('aria-label', `Sisa waktu ${formatTime(order.remaining)}`);
        });
      });
      // Warna kartu ikut pita waktu → render ulang hanya saat melewati batas pita
      if (bandChanged) render();
      else if (changed) saveOrders();
    }, 1000);
    // ── Refresh: muat ulang board tanpa membuat timer melompat ──
    boardRefresh.addEventListener('click', () => {
      lastTickAt = Date.now();
      render();
      // Restart animasi putar: hapus class → paksa reflow → pasang lagi
      boardRefresh.classList.remove('is-spinning');
      void boardRefresh.offsetWidth;
      boardRefresh.classList.add('is-spinning');
      showToast(`Data kitchen diperbarui · ${orders.length} order`);
    });
    // ── Panel menu: default terbuka, bisa diciutkan jadi tombol ikon ──
    const boardLayout = document.getElementById('boardLayout');
    const menuPanelCollapse = document.getElementById('menuPanelCollapse');
    const menuPanelExpand = document.getElementById('menuPanelExpand');
    if (boardLayout && menuPanelCollapse && menuPanelExpand) {
      const setMenuPanelCollapsed = collapsed => {
        boardLayout.classList.toggle('panel-collapsed', collapsed);
        // Samakan status aria pada kedua tombol
        menuPanelCollapse.setAttribute('aria-expanded', String(!collapsed));
        menuPanelExpand.setAttribute('aria-expanded', String(!collapsed));
        render();
      };
      menuPanelCollapse.addEventListener('click', () => setMenuPanelCollapsed(true));
      menuPanelExpand.addEventListener('click', () => setMenuPanelCollapsed(false));
    }
    // ── App shell: sidebar, navigation & header interactions ──
    const shellLayout = document.getElementById('shellLayout');
    const sidebarToggle = document.getElementById('sidebarToggle');
    if (sidebarToggle) sidebarToggle.addEventListener('click', () => {
      const collapsed = shellLayout.classList.toggle('sidebar-collapsed');
      sidebarToggle.setAttribute('aria-expanded', String(!collapsed));
      sidebarToggle.setAttribute('aria-label', collapsed ? 'Buka sidebar' : 'Tutup sidebar');
    });
    const pageTitle = document.getElementById('pageTitle');
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        document.querySelectorAll('.nav-link').forEach(item => { item.classList.remove('is-active'); item.removeAttribute('aria-current'); });
        link.classList.add('is-active');
        link.setAttribute('aria-current', 'page');
        if (pageTitle) pageTitle.textContent = link.dataset.nav;
        showToast(`Menu: ${link.dataset.nav}`);
      });
    });
    const menuButtons = [...document.querySelectorAll('[data-menu-target]')];
    function closeMenus(except) {
      menuButtons.forEach(button => {
        const menu = document.getElementById(button.dataset.menuTarget);
        if (menu === except) return;
        menu.classList.add('hidden');
        button.setAttribute('aria-expanded', 'false');
      });
    }
    menuButtons.forEach(button => {
      const menu = document.getElementById(button.dataset.menuTarget);
      button.addEventListener('click', event => {
        event.stopPropagation();
        const willOpen = menu.classList.contains('hidden');
        closeMenus(willOpen ? menu : null);
        menu.classList.toggle('hidden', !willOpen);
        button.setAttribute('aria-expanded', String(willOpen));
      });
      menu.addEventListener('click', event => event.stopPropagation());
    });
    document.addEventListener('click', () => closeMenus());
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenus(); });
    document.querySelectorAll('[data-workspace]').forEach(option => {
      option.addEventListener('click', () => {
        document.querySelectorAll('[data-workspace]').forEach(item => item.classList.remove('is-selected'));
        option.classList.add('is-selected');
        document.getElementById('workspaceLabel').textContent = option.dataset.workspace;
        closeMenus();
        showToast(`Workspace: ${option.dataset.workspace}`);
      });
    });
    document.querySelectorAll('[data-notification]').forEach(button => {
      button.addEventListener('click', () => { closeMenus(); showToast(button.dataset.notification); });
    });
    const fullscreenButton = document.getElementById('fullscreenButton');
    if (fullscreenButton) fullscreenButton.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch (_) { showToast('Fullscreen tidak didukung browser ini'); }
    });
    // Render pertama: boleh animasi masuk, berikutnya filter/tab/search tidak
    render(true);
  </script>
</body>
</html>
